name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        if: ${{ !cancelled() }}
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/
          if-no-files-found: ignore
